# 01-infra/1.3-ai-router — Omniroute (Dokploy Stack / Swarm)
version: "3.8"

services:
  ai-router:
    image: diegosouzapw/omniroute:3.8.17
    environment:
      JWT_SECRET: ${ROUTER_JWT_SECRET}
      INITIAL_PASSWORD: ${ROUTER_ADMIN_PASSWORD}
      API_KEY_SECRET: ${ROUTER_MASTER_KEY}
      DATA_DIR: /app/data
      PORT: "20128"
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/travis/10-docker-data}/ai_router_data_${DEPLOY_ENV:-dev}
        target: /app/data
    ports:
      - target: 20128
        published: ${ROUTER_HTTP_PORT:-22128}
        protocol: tcp
        mode: host
    networks:
      - dokploy-network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

networks:
  dokploy-network:
    external: true