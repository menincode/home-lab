services:
  postgres:
    # TimescaleDB 2.18.0 on PostgreSQL 16 (OSS). Cùng env như Postgres thường.
    image: timescale/timescaledb:latest-pg16
    container_name: postgres-${DEPLOY_ENV:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ycm_dev}
    volumes:
      - ${DATA_DIR:-.}/postgres_data_${DEPLOY_ENV:-dev}:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    networks:
      dokploy-network:
        aliases:
          - postgres-${DEPLOY_ENV:-dev}

  minio:
    image: quay.io/gsmartsoft/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: minio-${DEPLOY_ENV:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${DATA_DIR:-.}/minio_data_${DEPLOY_ENV:-dev}:/data
    ports:
      - '127.0.0.1:${MINIO_PORT:-55900}:9000'
      - '127.0.0.1:${MINIO_UI_PORT:-55751}:9001'
    command: server /data --address ":9000" --console-address ":9001"
    networks:
      dokploy-network:
        aliases:
          - minio-${DEPLOY_ENV:-dev}

networks:
  dokploy-network:
    external: true
