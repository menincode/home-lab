# Dokploy labs — env: .env.dokploy.generated
name: lab-01-artex-llm

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-01-artex-llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - ${DATA_DIR:-.}/01-artex-llm_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10

  artex:
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-latest}
    container_name: lab-01-artex-llm-artex
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD:-change-me-please}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      ARTEX_LANG: ${ARTEX_LANG:-en}
    ports:
      - "127.0.0.1:${ARTEX_HTTP_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      - ${DATA_DIR:-.}/01-artex-llm_data:/app/data