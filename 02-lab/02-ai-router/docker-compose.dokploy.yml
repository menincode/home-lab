# Dokploy labs — pg + redis (omniroute → 01-infra/03-ai-router)
name: lab-02-ai-router

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: lab-02-ai-router-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ailab}
    volumes:
      - ${DATA_DIR:-/home/travis/10-docker-data}/02-ai-router-postgres:/var/lib/postgresql/data
    ports:
      - "${ROUTER_PG_PORT:-25432}:5432"
    command: postgres -c shared_buffers=1GB -c max_connections=200

  redis:
    image: redis:7-alpine
    container_name: lab-02-ai-router-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - ${DATA_DIR:-/home/travis/10-docker-data}/02-ai-router-redis:/data
    ports:
      - "${ROUTER_REDIS_PORT:-26379}:6379"