# Dokploy project labs — env: .env.dokploy.generated
name: lab-03-decap-cms

services:
  decap-server:
    image: node:22-alpine
    container_name: lab-03-decap-cms-proxy
    restart: unless-stopped
    working_dir: /repo
    environment:
      PORT: "8081"
      BIND_HOST: "0.0.0.0"
      MODE: ${DECAP_SERVER_MODE:-git}
      GIT_REPO_DIRECTORY: /repo
      ORIGIN: http://${DECAP_PUBLIC_HOST}:${DECAP_HTTP_PORT}
      DECAP_PUBLIC_HOST: ${DECAP_PUBLIC_HOST}
      DECAP_HTTP_PORT: ${DECAP_HTTP_PORT}
      DECAP_PROXY_PORT: ${DECAP_PROXY_PORT}
    ports:
      - "${DECAP_PROXY_PORT}:8081"
    volumes:
      - decap-repo:/repo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache git >/dev/null
        npm install -g decap-server@3.11.6 >/dev/null 2>&1
        HOST="$${DECAP_PUBLIC_HOST}"
        PPORT="$${DECAP_PROXY_PORT}"
        if [ ! -f /repo/admin/config.yml ]; then
          mkdir -p /repo/admin /repo/content/posts /repo/static/images
          printf '%s\n' \
            "local_backend:" \
            "  url: http://$${HOST}:$${PPORT}/api/v1" \
            "  allowed_hosts: [\"localhost\", \"127.0.0.1\", \"$${HOST}\"]" \
            "backend:" \
            "  name: git-gateway" \
            "  branch: main" \
            "publish_mode: editorial_workflow" \
            "media_folder: static/images" \
            "public_folder: /static/images" \
            "collections:" \
            "  - name: blog" \
            "    label: Blog" \
            "    folder: content/posts" \
            "    create: true" \
            "    fields:" \
            "      - { label: Title, name: title, widget: string }" \
            "      - { label: Body, name: body, widget: markdown }" \
            > /repo/admin/config.yml
          printf '%s\n' '---' 'title: Welcome' '---' '' > /repo/content/posts/welcome.md
        fi
        sed -i "s|^\(  url: \)http://[^ ]*|\1http://$${HOST}:$${PPORT}/api/v1|" /repo/admin/config.yml
        sed -i "s|allowed_hosts:.*|allowed_hosts: [\"localhost\", \"127.0.0.1\", \"$${HOST}\"]|" /repo/admin/config.yml
        if [ ! -d /repo/.git ]; then
          cd /repo && git init -b main && git config user.email decap@local && git config user.name Decap
          git add -A && git commit -m init || true
        fi
        exec decap-server

  cms:
    image: itsmejoeeey/docker-decap-cms-standalone:latest
    container_name: lab-03-decap-cms-cms
    restart: unless-stopped
    depends_on:
      - decap-server
    ports:
      - "${DECAP_HTTP_PORT}:80"
    environment:
      ORIGINS: http://${DECAP_PUBLIC_HOST}:${DECAP_HTTP_PORT}
      OAUTH_CLIENT_ID: local-backend
      OAUTH_CLIENT_SECRET: local-backend
    volumes:
      - decap-repo:/repo:ro
    entrypoint: ["/bin/sh", "-c", "ln -sf /repo/admin/config.yml /app/config.yml; exec node /app/app.js"]

volumes:
  decap-repo: