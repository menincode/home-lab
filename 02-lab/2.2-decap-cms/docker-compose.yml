# 02-lab/03-decap-cms
name: lab-${LAB_FOLDER:-03-decap-cms}

services:
  decap-server:
    image: node:22-alpine
    container_name: lab-${LAB_FOLDER:-03-decap-cms}-proxy
    restart: unless-stopped
    working_dir: /repo
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8081"
      BIND_HOST: "0.0.0.0"
      MODE: ${DECAP_SERVER_MODE:-git}
      GIT_REPO_DIRECTORY: /repo
      ORIGIN: http://${DECAP_PUBLIC_HOST:-127.0.0.1}:${DECAP_HTTP_PORT:-8790}
      DECAP_PUBLIC_HOST: ${DECAP_PUBLIC_HOST:-127.0.0.1}
      DECAP_HTTP_PORT: ${DECAP_HTTP_PORT:-8790}
      DECAP_PROXY_PORT: ${DECAP_PROXY_PORT:-8791}
    ports:
      - "${DECAP_BIND:-127.0.0.1}:${DECAP_PROXY_PORT:-8791}:8081"
    volumes:
      - ${DECAP_CONTENT:-./repo}:/repo
      - ./decap-server/entrypoint.sh:/entrypoint.sh:ro

  cms:
    image: itsmejoeeey/docker-decap-cms-standalone:latest
    container_name: lab-${LAB_FOLDER:-03-decap-cms}-cms
    restart: unless-stopped
    depends_on:
      - decap-server
    env_file:
      - path: .env
        required: false
    ports:
      - "${DECAP_BIND:-127.0.0.1}:${DECAP_HTTP_PORT:-8790}:80"
    environment:
      ORIGINS: http://${DECAP_PUBLIC_HOST:-127.0.0.1}:${DECAP_HTTP_PORT:-8790}
      OAUTH_CLIENT_ID: local-backend
      OAUTH_CLIENT_SECRET: local-backend
    volumes:
      - ${DECAP_CONTENT:-./repo}:/repo:ro
    entrypoint: ["/bin/sh", "-c", "ln -sf /repo/admin/config.yml /app/config.yml 2>/dev/null; exec node /app/app.js"]