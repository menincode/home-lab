# Dokploy Swarm stack — official GitHub Actions runner image
# Image: https://github.com/actions/runner/pkgs/container/actions-runner
services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/actions/actions-runner:latest}
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    configs:
      - source: runner_entrypoint
        target: /custom-entrypoint.sh
        mode: 0555
        uid: "0"
        gid: "0"
    environment:
      ORG_NAME: ${ORG_NAME:-wmastudio}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      REPO_NAME: ${REPO_NAME:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-ubuntu-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,Linux,X64,docker,wmastudio}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      RUNNER_PERSIST_DIR: /home/runner/persist
      DISABLE_AUTOMATIC_DEREGISTRATION: ${DISABLE_AUTOMATIC_DEREGISTRATION:-true}
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: ${ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT:-0}
      # Used by entrypoint when dropping root → runner (Swarm has no group_add)
      DOCKER_GID: ${DOCKER_GID:-999}
      RUNNER_UID: ${RUNNER_UID:-1001}
      RUNNER_GID: ${RUNNER_GID:-1001}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_ROOT:-/home/travis/11-github-runner}:/home/runner/persist
    # Start as root so the Swarm config is readable; entrypoint drops to runner
    # and adds DOCKER_GID as a supplementary group for docker.sock.
    user: "0:0"
    networks:
      - dokploy-network
    deploy:
      mode: replicated
      replicas: ${RUNNER_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first

# Swarm configs are immutable (content cannot be updated). Bump ENTRYPOINT_VER
# in Dokploy env whenever entrypoint.sh changes, then redeploy.
configs:
  runner_entrypoint:
    name: runner-entrypoint-${ENTRYPOINT_VER:-3}
    file: ./entrypoint.sh

networks:
  dokploy-network:
    external: true
