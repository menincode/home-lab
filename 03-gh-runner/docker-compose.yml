# Dokploy Swarm stack (composeType: stack)
# Avoid: Swarm configs, {{.Task.Slot}} bind paths, custom entrypoint —
# those leave tasks stuck in Preparing on Dokploy.
services:
  runner:
    image: ${RUNNER_IMAGE:-myoung34/github-runner:latest}
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/wmastudio}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      ORG_NAME: ${ORG_NAME:-wmastudio}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-ubuntu-runner}
      LABELS: ${RUNNER_LABELS:-self-hosted,ubuntu,docker,wmastudio}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      PREPULL: ${PREPULL:-true}
      EXPOSE_DOCKER: ${EXPOSE_DOCKER:-true}
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /tmp/github-runner
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      RANDOM_RUNNER_SUFFIX: ${RANDOM_RUNNER_SUFFIX:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Single host dir — keep RUNNER_REPLICAS=1
      - ${RUNNER_DATA_ROOT:-/home/travis/11-github-runner}:/tmp/github-runner
    networks:
      - dokploy-network
    deploy:
      mode: replicated
      replicas: ${RUNNER_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first

networks:
  dokploy-network:
    external: true
