# Dokploy Swarm stack — official GitHub Actions runner image
# Image: https://github.com/actions/runner/pkgs/container/actions-runner
services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/actions/actions-runner:latest}
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    configs:
      - source: runner_entrypoint
        target: /custom-entrypoint.sh
        mode: 0755
    environment:
      ORG_NAME: ${ORG_NAME:-wmastudio}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      REPO_NAME: ${REPO_NAME:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-ubuntu-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,Linux,X64,docker,wmastudio}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      RUNNER_PERSIST_DIR: /home/runner/persist
      DISABLE_AUTOMATIC_DEREGISTRATION: ${DISABLE_AUTOMATIC_DEREGISTRATION:-true}
      # Quieter logs than ARC default
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: ${ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_ROOT:-/home/travis/11-github-runner}:/home/runner/persist
    # Swarm stack schema rejects group_add. Match host docker.sock GID as primary group
    # so the runner can use the socket (stat -c '%g' /var/run/docker.sock on the node).
    user: "${RUNNER_UID:-1001}:${DOCKER_GID:-999}"
    networks:
      - dokploy-network
    deploy:
      mode: replicated
      replicas: ${RUNNER_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first

configs:
  runner_entrypoint:
    file: ./entrypoint.sh

networks:
  dokploy-network:
    external: true
