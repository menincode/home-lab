x-common-env: &common-env
  REPO_URL: ${REPO_URL:-https://github.com/FFShopGaming}
  RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
  ORG_NAME: ${ORG_NAME:-FFShopGaming}
  # Absolute path on the bind mount — relative _work fills the container overlay (ENOSPC).
  RUNNER_WORKDIR: ${RUNNER_WORKDIR:-/tmp/github-runner/_work}
  PREPULL: ${PREPULL:-true}
  EXPOSE_DOCKER: ${EXPOSE_DOCKER:-true}
  CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /tmp/github-runner
  DISABLE_AUTOMATIC_DEREGISTRATION: "true"
  RANDOM_RUNNER_SUFFIX: "false"

x-runner-common: &runner-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${RUNNER_IMAGE:-ffshop-github-runner:latest}
  restart: always
  env_file:
    - .env
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

services:
  runner-1:
    <<: *runner-common
    environment:
      <<: *common-env
      RUNNER_NAME: ubuntu-runner-01
      RUNNER_LABELS: self-hosted,ubuntu,docker,runner-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_ROOT:-./runner-data}/runner-1:/tmp/github-runner
      # Sibling dir (not runner-N/_diag) — nested _diag is also /tmp/github-runner/_diag → cp "same file"
      - ${RUNNER_DATA_ROOT:-./runner-data}/runner-1-diag:/actions-runner/_diag

  runner-2:
    <<: *runner-common
    environment:
      <<: *common-env
      RUNNER_NAME: ubuntu-runner-02
      RUNNER_LABELS: self-hosted,ubuntu,docker,runner-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_ROOT:-./runner-data}/runner-2:/tmp/github-runner
      - ${RUNNER_DATA_ROOT:-./runner-data}/runner-2-diag:/actions-runner/_diag

  runner-3:
    <<: *runner-common
    environment:
      <<: *common-env
      RUNNER_NAME: ubuntu-runner-03
      RUNNER_LABELS: self-hosted,ubuntu,docker,runner-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_ROOT:-./runner-data}/runner-3:/tmp/github-runner
      - ${RUNNER_DATA_ROOT:-./runner-data}/runner-3-diag:/actions-runner/_diag
