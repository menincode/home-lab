# Dokploy Swarm stack — myoung34/github-runner
# https://github.com/myoung34/docker-github-actions-runner
services:
  runner:
    image: ${RUNNER_IMAGE:-myoung34/github-runner:latest}
    environment:
      ORG_NAME: ${ORG_NAME:-wmastudio}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      # Org scope: https://github.com/<org>  |  Repo: https://github.com/<org>/<repo>
      REPO_URL: ${REPO_URL:-https://github.com/wmastudio}
      # Prefer PAT (ACCESS_TOKEN). One-shot UI token: set RUNNER_TOKEN instead.
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-ubuntu-runner}
      LABELS: ${LABELS:-self-hosted,Linux,X64,docker,wmastudio}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      DISABLE_AUTOMATIC_DEREGISTRATION: ${DISABLE_AUTOMATIC_DEREGISTRATION:-true}
      RANDOM_RUNNER_SUFFIX: ${RANDOM_RUNNER_SUFFIX:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # myoung34 persists runner config under /tmp/github-runner when reusage is on
      - ${RUNNER_DATA_ROOT:-/home/travis/11-github-runner}:/tmp/github-runner
    networks:
      - dokploy-network
    deploy:
      mode: replicated
      replicas: ${RUNNER_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first

networks:
  dokploy-network:
    external: true
