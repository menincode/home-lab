services:
  runner:
    image: ${RUNNER_IMAGE:-myoung34/github-runner:latest}
    hostname: "{{.Service.Name}}-{{.Task.Slot}}"
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    configs:
      - source: runner_entrypoint
        target: /custom-entrypoint.sh
        mode: 0755
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/menincode}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      ORG_NAME: ${ORG_NAME:-menincode}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?ACCESS_TOKEN is required}
      RUNNER_NAME: ${RUNNER_NAME:-ubuntu-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,ubuntu,docker}
      LABELS: ${RUNNER_LABELS:-self-hosted,ubuntu,docker}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-/tmp/github-runner/_work}
      PREPULL: ${PREPULL:-true}
      EXPOSE_DOCKER: ${EXPOSE_DOCKER:-true}
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /tmp/github-runner
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      RANDOM_RUNNER_SUFFIX: ${RANDOM_RUNNER_SUFFIX:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_ROOT:?set RUNNER_DATA_ROOT to an absolute host path}/{{.Task.Slot}}:/tmp/github-runner
      - ${RUNNER_DATA_ROOT}/{{.Task.Slot}}-diag:/actions-runner/_diag
    networks:
      - gh-runner
    deploy:
      mode: replicated
      replicas: ${RUNNER_REPLICAS:-3}
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        order: stop-first

configs:
  runner_entrypoint:
    file: ./entrypoint.sh

networks:
  gh-runner:
    driver: overlay
    attachable: true
