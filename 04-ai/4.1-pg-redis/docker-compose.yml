# 04-ai/4.1-pg-redis — Dokploy Compose Type: Stack (Swarm)
# Omniroute → 01-infra/1.3-ai-router
version: "3.8"

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ailab}
    command: postgres -c shared_buffers=1GB -c max_connections=200
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/travis/10-docker-data}/${AI_FOLDER:-4.1-pg-redis}-postgres
        target: /var/lib/postgresql/data
    ports:
      - target: 5432
        published: ${ROUTER_PG_PORT:-25432}
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/travis/10-docker-data}/${AI_FOLDER:-4.1-pg-redis}-redis
        target: /data
    ports:
      - target: 6379
        published: ${ROUTER_REDIS_PORT:-26379}
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager