# 05-security/5.1-artex-llm — Dokploy Compose Type: Stack (Swarm)
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-please}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/travis/10-docker-data}/${SEC_FOLDER:-5.1-artex-llm}_postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  artex:
    image: ghcr.io/jiwoochris/artex-global:${ARTEX_TAG:-latest}
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD:-change-me-please}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      ARTEX_LANG: ${ARTEX_LANG:-en}
    volumes:
      - type: bind
        source: ${DATA_DIR:-/home/travis/10-docker-data}/${SEC_FOLDER:-5.1-artex-llm}_data
        target: /app/data
    ports:
      - target: 8787
        published: ${ARTEX_HTTP_PORT:-8787}
        protocol: tcp
        mode: host
      - target: 8788
        published: ${ARTEX_PROXY_PORT:-8788}
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager